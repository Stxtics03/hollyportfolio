# Type-checks and builds the site on every push and PR to main.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Nothing here writes to the repo, so the token gets read access and no more.
permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant — cancel it
# rather than paying for a build of code nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 18.x is dropped on purpose: it went EOL in April 2025, and
        # react-router-dom@7 declares engines.node >= 20.
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        # Both this and `npm ci` below read package-lock.json, which is
        # committed. Remove the lockfile and this step fails before install.
        cache: 'npm'
    - run: npm ci
    # `npm run build` already runs `tsc -b`, but running the type-check as its
    # own step means a type error reports as a type error rather than as a
    # failed build.
    - run: npm run typecheck
    - run: npm run build
